<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voedingstracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --ink:#14312B; --muted:#5F746C; --line:#DCE6E1;
  --accent:#1F7A5C; --accent-ink:#FFFFFF; --accent-soft:rgba(31,122,92,.10);
  --p:#3B6FD4; --c:#E3A02B; --f:#D6577B; --over:#C8402F;
  --hero1:#0C3429; --hero2:#1F7A5C; --hero3:#3FAE86;
  --shadow:0 2px 10px rgba(20,49,43,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1815; --surface:#162521; --ink:#E6F0EC; --muted:#93A89F; --line:#25372F;
    --accent:#45B68F; --accent-ink:#0B1512; --accent-soft:rgba(69,182,143,.14);
    --p:#6E97EE; --c:#F0B84F; --f:#EC7F9C; --over:#F0705F;
    --hero1:#0A241C; --hero2:#155741; --hero3:#2F8F6B; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#162521; --ink:#E6F0EC; --muted:#93A89F; --line:#25372F;
  --accent:#45B68F; --accent-ink:#0B1512; --accent-soft:rgba(69,182,143,.14);
  --p:#6E97EE; --c:#F0B84F; --f:#EC7F9C; --over:#F0705F;
  --hero1:#0A241C; --hero2:#155741; --hero3:#2F8F6B; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:12px 14px 100px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 16px 70px;color:#fff;
  background:radial-gradient(120% 120% at 100% 0%,var(--hero3) 0%,transparent 55%),linear-gradient(140deg,var(--hero1),var(--hero2))}
.hero .deco{position:absolute;right:-40px;top:-40px;width:220px;height:220px;pointer-events:none}
.herotop{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.herotop small{display:block;font-size:14px;opacity:.85}
.herotop h1{font-size:28px;line-height:1.1;margin-top:2px}
.pill{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:20px;height:36px;padding:0 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.heromsg{position:relative;margin:10px 0 14px;font-size:15px;opacity:.95;max-width:34ch}
.datebar{position:relative;display:flex;align-items:center;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.datelabel{position:relative;flex:1;text-align:center;background:rgba(255,255,255,.14);border-radius:14px;padding:6px 8px}
.datelabel strong{display:block;font-size:17px;font-weight:800;text-transform:capitalize}
.datelabel span{font-size:12.5px;opacity:.85}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* summary */
.summary{position:relative;margin:-50px 6px 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 16px;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:210px;height:210px;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcenter .big{font-size:46px;font-weight:800;line-height:1}
.ringcenter .big.over{color:var(--over)}
.ringcenter .sub{font-size:14px;color:var(--muted);margin-top:4px}
.ringcenter .eaten{font-size:13px;color:var(--muted);margin-top:8px}
.macros{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{background:var(--bg);border-radius:14px;padding:10px}
.macro .lab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.macro .dot{width:9px;height:9px;border-radius:50%}
.macro .val{font-size:20px;font-weight:800;margin:4px 0 6px}
.macro .val small{font-size:12px;font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}

/* widgets */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:104px}
.widget .wt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.widget .wi{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px}
.widget .wv{font-size:26px;font-weight:800;line-height:1.1;margin-top:6px}
.widget .wv small{font-size:13px;font-weight:400;color:var(--muted)}
.widget .ws{font-size:12.5px;color:var(--muted)}
.wbtns{display:flex;gap:6px;margin-top:auto}
.wbtns button{flex:1;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px;line-height:1}
.wbtns button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.glasses{display:flex;gap:3px;margin:6px 0 8px}
.glasses i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.glasses i.on{background:#3B9FD8}
.spark{width:100%;height:28px;margin-top:4px}

/* meals */
.meal{margin-top:18px}
.mealband{display:flex;align-items:center;justify-content:space-between;border-radius:18px 18px 0 0;padding:10px 12px;border:1px solid var(--line);border-bottom:0}
.mealband .l{display:flex;align-items:center;gap:10px}
.mealband .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--surface)}
.mealband h3{font-size:17px}
.mealband .k{font-size:13px;color:var(--muted)}
.addbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:20px;height:36px;padding:0 14px;font-weight:700;font-size:14px}
.m-ontbijt{background:linear-gradient(100deg,rgba(227,160,43,.26),rgba(227,160,43,.06))}
.m-lunch{background:linear-gradient(100deg,rgba(69,182,143,.26),rgba(69,182,143,.06))}
.m-diner{background:linear-gradient(100deg,rgba(59,111,212,.24),rgba(59,111,212,.06))}
.m-snack{background:linear-gradient(100deg,rgba(214,87,123,.24),rgba(214,87,123,.06))}
.entries{background:var(--surface);border:1px solid var(--line);border-radius:0 0 18px 18px;overflow:hidden}
.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .n{font-weight:600;overflow-wrap:anywhere}
.entry .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.entry .m b{font-weight:600}
.entry .kc{font-weight:800;white-space:nowrap}
.entry .kc small{font-weight:400;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:14px}
.dp{color:var(--p)}.dc{color:var(--c)}.df{color:var(--f)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;width:100%;max-width:520px;gap:2px}
nav.tabs button{flex:1;background:none;border:0;border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* pagehead */
.pagehead{border-radius:22px;padding:18px 16px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,var(--hero3) 0%,transparent 60%),linear-gradient(140deg,var(--hero1),var(--hero2))}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0;opacity:.9;font-size:14.5px}
.pagehead .deco{position:absolute;right:-30px;top:-30px;width:160px;height:160px}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:12px}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;width:100%;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.primary{width:100%;height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px}
.secondary{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;color:var(--accent)}
.ghost{height:44px;border:1px solid var(--line);border-radius:14px;background:none;font-weight:600;color:var(--over);padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:20px;font-weight:800}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:16px;height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chartbox svg{display:block;width:100%;height:auto;min-width:300px}
.chartbox{overflow-x:auto}
.readout{font-size:14px;color:var(--muted);min-height:20px;margin-top:6px}
.readout b{color:var(--ink)}
.wlist .wrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wlist .wrow:last-child{border-bottom:0}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.hint.warn{color:var(--over)}

/* tips */
.left4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.left4 div{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.left4 b{display:block;font-size:20px;font-weight:800}
.left4 span{font-size:12px;color:var(--muted)}
.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tip:last-child{border-bottom:0}
.tip .ti{flex:none;width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg .n{font-weight:700}
.sugg .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.sugg button{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;height:36px;padding:0 14px;font-weight:700}
.ideas{white-space:pre-wrap;font-size:15px;line-height:1.5;margin-top:10px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,18,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));height:88%;overflow-y:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead h2{font-size:20px}
.xbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:11px;height:38px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:0 14px;font-size:16px}
.rhead{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.res .n{font-weight:600}
.res .m{font-size:12.5px;color:var(--muted)}
.res .r{font-size:12.5px;color:var(--accent);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tag.ai{background:rgba(214,87,123,.15);color:var(--f)}
.recent{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.recent button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:16px;height:34px;padding:0 12px;font-size:13.5px;font-weight:600}
.scanbox{border-radius:18px;overflow:hidden;background:#0B1512;min-height:190px;display:grid;place-items:center;margin-bottom:12px;position:relative}
#reader{width:100%}
.scanmsg{color:#cfe3db;font-size:14px;padding:14px;text-align:center}
.or{text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
.inline{display:flex;gap:8px}
.inline input{flex:1;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px}
.inline button{flex:none;height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px}
.notice{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.result{background:var(--bg);border-radius:16px;padding:14px;margin:4px 0 12px;text-align:center}
.result b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.result span{font-size:13.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:4px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:60;max-width:88%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.bar i,.toast{transition:none}}
</style>
</head>

var dbCol=null, dirtyMonths={}, dirtyMeta=false, saving=false, saveTimer=null;

function monthKey(d){return 'm-'+d.slice(0,7)}
function markDirty(d){if(d)dirtyMonths[monthKey(d)]=true;else dirtyMeta=true;saveLocal();if(dbCol){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}}
function metaObj(){return {goals:S.goals,weights:S.weights,products:S.products,water:S.water,profile:S.profile}}
async function flush(){
  if(!dbCol||saving)return;
  saving=true;
  try{
    while(dirtyMeta||Object.keys(dirtyMonths).length){
      if(dirtyMeta){dirtyMeta=false;await dbCol.doc('meta').set({json:JSON.stringify(metaObj())})}
      var keys=Object.keys(dirtyMonths);dirtyMonths={};
      for(var i=0;i<keys.length;i++){
        var ym=keys[i].slice(2),days={};
        Object.keys(S.days).forEach(function(d){if(d.slice(0,7)===ym&&S.days[d].length)days[d]=S.days[d]});
        await dbCol.doc(keys[i]).set({json:JSON.stringify(days)});
      }
    }
  }catch(e){console.error('Opslaan mislukt',e)}
  saving=false;
}

    var db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    var id=await user.id();if(!id)return;
    dbCol=db.collection('data/users/'+id);
    var snap=await dbCol.get();
    if(snap.empty){
      if(S.weights.length||Object.keys(S.days).length||S.products.length){dirtyMeta=true;Object.keys(S.days).forEach(function(d){dirtyMonths[monthKey(d)]=true});flush()}
    }else{
      var days={},meta=null;
      snap.docs.forEach(function(d){
        var data=d.data()||{};if(!data.json)return;
        var parsed;try{parsed=JSON.parse(data.json)}catch(e){return}
        if(d.id==='meta')meta=parsed;else if(d.id.indexOf('m-')===0)Object.assign(days,parsed);

function ringSVG(tot){
  var goal=Math.max(S.goals.kcal,1),R=86,C=2*Math.PI*R,frac=Math.min(tot.kcal/goal,1);
  var mk={p:tot.p*4,c:tot.c*4,f:tot.f*9},msum=mk.p+mk.c+mk.f,segs='';
  if(msum>0&&frac>0){
    var off=0;
    [['p','var(--p)'],['c','var(--c)'],['f','var(--f)']].forEach(function(m){
      var len=C*frac*(mk[m[0]]/msum);
      if(len>0.5)segs+='<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="'+m[1]+'" stroke-width="17" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';
      off+=len;
    });
  }else if(frac>0){segs='<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="17" stroke-dasharray="'+(C*frac)+' '+C+'"/>'}
  return '<svg viewBox="0 0 210 210" role="img" aria-label="Calorieën gegeten"><circle cx="105" cy="105" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="17"/>'+segs+'</svg>';
}
function macroCard(label,val,goal,color){
  var pct=goal>0?Math.min(val/goal*100,100):0;
  return '<div class="macro"><div class="lab"><i class="dot" style="background:'+color+'"></i>'+label+'</div><div class="val num">'+nf(val)+'<small> / '+nf(goal)+' g</small></div><div class="bar"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
}
function streak(){var d=todayIso();if(!dayEntries(d).length)d=addDays(d,-1);var n=0;while(dayEntries(d).length&&n<1000){n++;d=addDays(d,-1)}return n}
function avg7(){var t=todayIso(),s=0,n=0;for(var i=0;i<7;i++){var l=dayEntries(addDays(t,-i));if(l.length){s+=sumOf(l).kcal;n++}}return n?Math.round(s/n):0}
function sparkline(){
  var w=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1}).slice(-12);
  if(w.length<2)return '';
  var mn=Math.min.apply(null,w.map(function(p){return p.kg})),mx=Math.max.apply(null,w.map(function(p){return p.kg}));if(mx===mn){mx+=1;mn-=1}
  var pts=w.map(function(p,i){return (i/(w.length-1)*100).toFixed(1)+','+(26-(p.kg-mn)/(mx-mn)*24).toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function recentFoods(){
  var seen={},out=[],dates=Object.keys(S.days).sort().reverse();
  for(var i=0;i<dates.length&&out.length<12;i++){
    var l=S.days[dates[i]];
    for(var j=l.length-1;j>=0&&out.length<12;j--){var k=l[j].name.toLowerCase();if(seen[k])continue;seen[k]=1;out.push(l[j])}
  }
  return out;
}

function itemPer100(it){return 'per 100 g: '+nf(it.kcal)+' kcal · E '+nf(it.p,1)+' · K '+nf(it.c,1)+' · V '+nf(it.f,1)}
function tagFor(it){return it.src==='own'?'<span class="tag">Mijn product</span>':it.src==='ai'?'<span class="tag ai">Schatting</span>':it.src==='off'?'<span class="tag">Open Food Facts</span>':''}
function searchLocal(q){
  var toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];
  var pool=S.products.map(function(p){return Object.assign({src:'own'},p)}).concat(DB);
  var hits=pool.filter(function(it){var n=norm(it.name);return toks.every(function(t){return n.indexOf(t)>-1})});
  var q0=norm(q);
  hits.sort(function(a,b){
    var sa=(a.src==='own'?-2:0)+(norm(a.name).indexOf(q0)===0?-1:0),sb=(b.src==='own'?-2:0)+(norm(b.name).indexOf(q0)===0?-1:0);
    return sa-sb||a.name.length-b.name.length;
  });
  return hits.slice(0,25);
}
function resRow(it,i){
  return '<button class="res" data-pick="'+i+'"><div><div class="n">'+esc(it.name)+tagFor(it)+'</div><div class="m num">'+itemPer100(it)+'</div></div><div class="r num">'+(it.portion?'1 '+esc(it.unit||'portie')+' · '+nf(it.portion)+' g':'')+'</div></button>';
}
function buildResults(){

  if(!q){
    if(local.length){h+='<div class="rhead">Mijn producten</div>'+local.map(function(it,i){return resRow(it,i)}).join('')}
    var rec=recentFoods();
    if(rec.length){sh.recent=rec;h+='<div class="rhead">Eerder gegeten</div><div class="recent">'+rec.map(function(r,i){return '<button data-rec="'+i+'">'+esc(r.name)+'</button>'}).join('')+'</div>'}

    return h;
  }
  if(local.length)h+=local.map(function(it,i){return resRow(it,i)}).join('');

var scanner=null;
var FORMATS=function(){var F=window.Html5QrcodeSupportedFormats;return F?[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128]:undefined};
function loadScanLib(){
  return new Promise(function(res,rej){
    if(window.Html5Qrcode)return res();
    var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload=res;s.onerror=function(){rej(new Error('lib'))};document.head.appendChild(s);
  });
}
function setScanMsg(t){var el=$('#scanMsg');if(el)el.textContent=t}
async function startScan(){
  setScanMsg('Camera starten…');
  try{
    await loadScanLib();
    scanner=new window.Html5Qrcode('reader',{formatsToSupport:FORMATS(),verbose:false});
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:130}},function(txt){onCode(txt)},function(){});
    var m=$('#scanMsg');if(m)m.style.display='none';
  }catch(e){
    scanner=null;
    setScanMsg('De camera is hier niet beschikbaar. Maak een foto van de barcode of typ de cijfers in.');
  }
}
async function stopScan(){
  if(scanner){var s=scanner;scanner=null;try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}
}
async function scanFromFile(file){
  setScanMsg('Foto lezen…');
  try{
    await loadScanLib();
    var h=new window.Html5Qrcode('readerf',{formatsToSupport:FORMATS(),verbose:false});
    var txt=await h.scanFile(file,false);
    try{h.clear()}catch(e){}
    onCode(txt);
  }catch(e){setScanMsg('Geen barcode gevonden op de foto. Probeer het scherper, of typ de cijfers in.')}
}
async function onCode(code){
  await stopScan();
  if(!sh||sh.lookup)return;
  code=String(code).trim();
  var p=S.products.find(function(x){return x.barcode&&x.barcode===code});
  if(p){sh.item=Object.assign({src:'own'},p);sh.mode='portion';toast('Product herkend');renderSheet();return}
  var mine=sh;
  sh.code=code;sh.msg='';sh.offErr=false;sh.lookup=true;renderSheet();
  var off=null;
  try{off=await offLookup(code)}catch(e){mine.offErr=true}
  mine.lookup=false;
  if(sh!==mine||sh.mode!=='scan'||sh.code!==code)return; // gebruiker is intussen ergens anders heen gegaan
  if(off){sh.item=off;sh.mode='portion';toast('Gevonden in Open Food Facts');}
  renderSheet();
}

/* ---------- Open Food Facts ---------- */
var OFFKEY='voedingstracker-off',OFFTTL=30*864e5; // cache 30 dagen
function offCache(){try{return JSON.parse(localStorage.getItem(OFFKEY))||{}}catch(e){return {}}}
function offStore(code,item){
  try{var c=offCache();c[code]={t:Date.now(),item:item};
    var keys=Object.keys(c);if(keys.length>300){keys.sort(function(a,b){return c[a].t-c[b].t}).slice(0,keys.length-300).forEach(function(k){delete c[k]})}
    localStorage.setItem(OFFKEY,JSON.stringify(c))}catch(e){}
}
function offToItem(code,pr){
  var n=pr&&pr.nutriments;if(!n)return null;
  var kcal=n['energy-kcal_100g'];
  if(!isFinite(kcal)&&isFinite(n['energy-kj_100g']))kcal=n['energy-kj_100g']/4.184;
  if(!isFinite(kcal))return null; // zonder kcal hebben we niets aan het product
  var name=String(pr.product_name_nl||pr.product_name||'Product').trim();
  var brand=String(pr.brands||'').split(',')[0].trim();
  if(brand&&name.toLowerCase().indexOf(brand.toLowerCase())<0)name+=' ('+brand+')';
  var serving=num(pr.serving_quantity);
  return {src:'off',isNew:true,barcode:code,name:name.slice(0,80),kcal:Math.round(num(kcal)),
    p:r1(num(n.proteins_100g)),c:r1(num(n.carbohydrates_100g)),f:r1(num(n.fat_100g)),
    portion:serving>0&&serving<2000?Math.round(serving):100,unit:'portie'};
}
async function offLookup(code){
  var hit=offCache()[code];
  if(hit&&Date.now()-hit.t<OFFTTL&&hit.item)return hit.item;
  var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort()},8000);
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_nl,brands,serving_quantity,nutriments',{signal:ctl.signal});
    if(r.status===404)return null; // barcode onbekend
    if(!r.ok)throw new Error('off '+r.status);
    var j=await r.json();
    var item=j&&j.status===1?offToItem(code,j.product):null;
    if(item)offStore(code,item);
    return item;
  }finally{clearTimeout(timer)}
}

function weightChart(pts){
  var W=340,H=210,L=38,R=14,T=14,B=26;
  if(!pts.length)return '<div class="empty">Nog geen metingen in deze periode.</div>';
  var vals=pts.map(function(p){return p.kg});if(S.goals.kg>0)vals.push(S.goals.kg);
  var lo=Math.floor(Math.min.apply(null,vals)-0.5),hi=Math.ceil(Math.max.apply(null,vals)+0.5);if(hi-lo<2)hi=lo+2;
  var t0=fromIso(pts[0].d).getTime(),t1=fromIso(pts[pts.length-1].d).getTime();
  var X=function(d){return t1===t0?(L+(W-L-R)/2):L+(fromIso(d).getTime()-t0)/(t1-t0)*(W-L-R)};
  var Y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" id="wsvg" role="img" aria-label="Gewichtsverloop" style="cursor:pointer"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  for(var i=0;i<=3;i++){var v=lo+(hi-lo)*i/3,y=Y(v);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+nf(v,1)+'</text>'}
  if(S.goals.kg>0){var gy=Y(S.goals.kg);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(gy-5)+'" text-anchor="end" font-size="11" fill="var(--c)">doel '+nf(S.goals.kg,1)+'</text>'}
  var path=pts.map(function(p,i){return (i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.kg).toFixed(1)}).join(' ');
  if(pts.length>1){
    s+='<path d="'+path+' L'+X(pts[pts.length-1].d).toFixed(1)+' '+(H-B)+' L'+X(pts[0].d).toFixed(1)+' '+(H-B)+' Z" fill="url(#wg)"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    var last=i===pts.length-1,sel=selW===p.d;
    s+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="'+(sel?6:last?5:pts.length>40?0:3)+'" fill="'+(sel||last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>';
  });

function remaining(){
  var tot=sumOf(dayEntries(todayIso())),g=S.goals;
  return {kcal:g.kcal-tot.kcal,p:g.p-tot.p,c:g.c-tot.c,f:g.f-tot.f,tot:tot};
}
function seeded(seed){var s=seed*9301+49297;return function(){s=(s*9301+49297)%233280;return s/233280}}
function suggestions(){
  var r=remaining();if(r.kcal<70)return [];
  var tv=[Math.max(r.p,0)*4,Math.max(r.c,0)*4,Math.max(r.f,0)*9],tn=Math.hypot(tv[0],tv[1],tv[2]);
  if(tn===0)tv=[1,1,1],tn=Math.sqrt(3);
  var pool=S.products.map(function(p){return Object.assign({src:'own'},p)}).concat(DB);
  var out=[];
  pool.forEach(function(it){
    if(it.name==='Koffie (zwart)'||it.name==='Bier'||it.name==='Rode wijn'||it.name==='Cola')return;
    var per=it.portion||100,best=null;
    [0.5,1,1.5,2,3].forEach(function(k){var s=scaleItem(it,per*k);if(s.kcal<=r.kcal*0.9&&s.kcal>=Math.min(60,r.kcal*0.3))best={k:k,g:Math.round(per*k),s:s}});
    if(!best)return;
    var v=[best.s.p*4,best.s.c*4,best.s.f*9],vn=Math.hypot(v[0],v[1],v[2])||1,cos=(v[0]*tv[0]+v[1]*tv[1]+v[2]*tv[2])/(vn*tn);
    var over=Math.max(0,best.s.p-Math.max(r.p,0))+Math.max(0,best.s.c-Math.max(r.c,0))+Math.max(0,best.s.f-Math.max(r.f,0));
    var sc=cos-over/(best.s.p+best.s.c+best.s.f+1)*0.8;
    var fi={p:0,c:1,f:2}[tipFocus];
    if(fi!==undefined){sc=(v[fi]/(v[0]+v[1]+v[2]+.001))*0.7+sc*0.3}
    if(it.src==='own')sc+=0.05;
    out.push({it:it,best:best,sc:sc});
  });
  out.sort(function(a,b){return b.sc-a.sc});
  var top=out.slice(0,14),rnd=seeded(tipSeed+1);
  if(tipSeed>0)top.sort(function(){return rnd()-.5});
  return top.slice(0,6);
}
function tipList(r){
  var t=[],g=S.goals,todayN=dayEntries(todayIso()).length,wn=S.water[todayIso()]||0;
  if(!todayN)t.push(['📝','Je hebt vandaag nog niets gelogd. Begin met je eerste maaltijd, dan worden de suggesties hieronder persoonlijk.']);
  else if(r.kcal<-g.kcal*0.05)t.push(['💛','Je zit '+nf(-r.kcal)+' kcal boven je doel. Eén dag verandert weinig; kijk naar het weekgemiddelde in plaats van naar één dag.']);
  else if(r.kcal>0){
    if(r.p>25)t.push(['💪','Je mist nog '+nf(r.p)+' g eiwit. Kwark, skyr, kip, tofu of een eiwitshake vullen dat snel aan.']);
    if(r.f<8&&r.kcal>200)t.push(['🥑','Je vetruimte is bijna op. Kies voor de rest van de dag mager en koolhydraatrijk, zoals fruit, rijst of brood.']);
    if(r.c<15&&r.kcal>200)t.push(['🥩','Je koolhydraten zitten bijna vol. Eiwit met groente past nu goed, bijvoorbeeld kip met broccoli.']);
    if(r.c>60&&r.kcal>250)t.push(['🍚','Je hebt nog ruimte voor '+nf(r.c)+' g koolhydraten, handig voor rijst, pasta, havermout of fruit.']);
    if(r.kcal<150)t.push(['🍎','Nog maar '+nf(r.kcal)+' kcal ruimte. Een stuk fruit of een bakje magere kwark past er net in.']);
  }else t.push(['✅','Je zit precies op je doel. Goed bezig.']);
  if(wn<4&&new Date().getHours()>=12)t.push(['💧','Je hebt pas '+wn+' glazen water gehad. Drinken helpt tegen onterechte trek.']);
  if(!t.length)t.push(['✅','Je verdeling ziet er goed uit. Houd het vol.']);
  return t.slice(0,4);
}
