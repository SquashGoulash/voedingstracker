<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voedingstracker</title>
<meta name="theme-color" content="#F4F4F5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F5; --surface:#FFFFFF; --ink:#18181B; --muted:#66666E; --line:#DCDCE0;
  --accent:#18181B; --accent-ink:#FFFFFF; --accent-soft:rgba(24,24,27,.06);
  --p:#3B6FD4; --c:#E3A02B; --f:#D6577B; --over:#C8402F;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F11; --surface:#1A1A1D; --ink:#F2F2F3; --muted:#9C9CA4; --line:#303035;
    --accent:#F2F2F3; --accent-ink:#141416; --accent-soft:rgba(255,255,255,.08);
    --p:#6E97EE; --c:#F0B84F; --f:#EC7F9C; --over:#F0705F; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F11; --surface:#1A1A1D; --ink:#F2F2F3; --muted:#9C9CA4; --line:#303035;
  --accent:#F2F2F3; --accent-ink:#141416; --accent-soft:rgba(255,255,255,.08);
  --p:#6E97EE; --c:#F0B84F; --f:#EC7F9C; --over:#F0705F; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 18px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:12px 14px 100px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* datumbalk (Vandaag en Week) */
.datebar{position:relative;display:flex;align-items:center;gap:8px}
.daytop{margin:4px 0 14px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.datelabel{position:relative;flex:1;text-align:center;padding:2px 8px}
.datelabel strong{display:block;font-size:17px;font-weight:800}
.datelabel span{font-size:13px;color:var(--muted)}
.datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* samenvatting */
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:168px;height:168px;margin:0 auto}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap circle{stroke-width:10}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringcenter .big{font-size:38px;font-weight:800;line-height:1}
.ringcenter .big.over{color:var(--over)}
.ringcenter .sub{font-size:14px;color:var(--muted);margin-top:4px}
.mac3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.mac3 span,.ext span{font-size:12.5px;color:var(--muted)}
.mac3 b,.ext b{display:block;font-size:16px;font-weight:700;margin:2px 0 6px;white-space:nowrap}
.mac3 small,.ext small{font-weight:400;color:var(--muted);font-size:12px}
.ext{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ext+.hint{margin:10px 0 0}
.thinbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.thinbar i{display:block;height:100%;border-radius:4px;transition:width .3s}

/* maaltijden (inklapbaar) */
.mealcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:2px 12px;box-shadow:var(--shadow)}
.sumcard+.mealcard,.tlink+.mealcard{margin-top:12px}
.mealhead{display:flex;align-items:center;gap:8px}
.mealtoggle{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 0;text-align:left;min-width:0}
.mealtoggle:disabled{cursor:default}
.mealtoggle b{font-weight:700;font-size:16px}
.mealtoggle .num{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.chev{display:grid;place-items:center;width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mealtoggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.plusbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--accent);font-size:20px;line-height:1;padding:0;display:grid;place-items:center;flex:none}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:11px 0}
.erow .n{font-weight:500;overflow-wrap:anywhere}
.erow .m{font-size:12.5px;color:var(--muted);margin-top:1px}
.erow .k{color:var(--muted);white-space:nowrap}
.tlink{display:block;border:0;background:none;color:var(--muted);font-size:13px;padding:8px 0 10px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);font-size:14px;padding:14px}
.dp{color:var(--p)}.dc{color:var(--c)}.df{color:var(--f)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;width:100%;max-width:520px;gap:2px}
nav.tabs button{flex:1;background:none;border:0;border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs button span{white-space:nowrap}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* pagehead */
.pagehead{padding:8px 2px 4px;margin-bottom:14px}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14.5px}

/* cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:19px;margin-bottom:12px}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;width:100%;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.primary{width:100%;height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px}
.secondary{width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;color:var(--accent)}
.ghost{height:44px;border:1px solid var(--line);border-radius:14px;background:none;font-weight:600;color:var(--over);padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font-size:20px;font-weight:800}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:16px;height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chartbox svg{display:block;width:100%;height:auto;min-width:300px}
.chartbox{overflow-x:auto}
.readout{font-size:14px;color:var(--muted);min-height:20px;margin-top:6px}
.readout b{color:var(--ink)}
.readout .linkbtn{color:var(--accent);font-weight:700;padding:0 0 0 6px}
.pagehead .datebar{margin-top:14px}
.vs{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.wlist .wrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wlist .wrow:last-child{border-bottom:0}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.hint.warn{color:var(--over)}
.trow{display:flex;align-items:center;gap:10px;min-height:54px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .check{margin:0;flex:1;min-height:44px}
.tgoal{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.tgoal input{width:64px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px;text-align:right;font-size:16px}

/* tips */
.left4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.left4 div{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.left4 b{display:block;font-size:20px;font-weight:800}
.left4 span{font-size:12px;color:var(--muted)}
.tip{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.tip:last-child{border-bottom:0}
.tip .ti{flex:none;width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.sugg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:0}
.sugg .n{font-weight:700}
.sugg .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.sugg button{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;height:36px;padding:0 14px;font-weight:700}
.ideas{white-space:pre-wrap;font-size:15px;line-height:1.5;margin-top:10px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));height:88%;overflow-y:auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead h2{font-size:20px}
.xbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:11px;height:38px;font-weight:700;font-size:14px;color:var(--muted)}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13.5px}
.paste{display:block;width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;resize:vertical;margin-bottom:10px}
.step{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.step:first-child{margin-top:0}
.pitem{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.pitem .check{margin:0;flex:1;min-width:0;align-items:flex-start}
.pitem .check input{margin-top:2px;flex:none}
.pitem .n{font-weight:600;overflow-wrap:anywhere}
.pitem .m{font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.searchbox{position:relative;margin-bottom:10px}
.searchbox input{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:0 14px;font-size:16px}
.rhead{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.res .n{font-weight:600}
.res .m{font-size:12.5px;color:var(--muted)}
.res .r{font-size:12.5px;color:var(--accent);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.tag.ai{background:rgba(214,87,123,.15);color:var(--f)}
.recent{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.recent button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:16px;height:34px;padding:0 12px;font-size:13.5px;font-weight:600}
.scanbox{border-radius:18px;overflow:hidden;background:#111113;min-height:190px;display:grid;place-items:center;margin-bottom:12px;position:relative}
#reader{width:100%}
.scanmsg{color:#DDDDE0;font-size:14px;padding:14px;text-align:center}
.or{text-align:center;color:var(--muted);font-size:13px;margin:10px 0}
.inline{display:flex;gap:8px}
.inline input{flex:1;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:16px}
.inline button{flex:none;height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 18px}
.notice{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.result{background:var(--bg);border-radius:16px;padding:14px;margin:4px 0 12px;text-align:center}
.result>b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.result span{font-size:13.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:4px}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;z-index:60;max-width:88%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.thinbar i,.chev,.toast{transition:none}}
</style>
</head>

var dbCol=null, dirtyMonths={}, dirtyMeta=false, saving=false, saveTimer=null;

function monthKey(d){return 'm-'+d.slice(0,7)}

async function flush(){
  if(!dbCol||saving)return;
  saving=true;
  try{
    while(dirtyMeta||Object.keys(dirtyMonths).length){
      if(dirtyMeta){dirtyMeta=false;await dbCol.doc('meta').set({json:JSON.stringify(metaObj())})}
      var keys=Object.keys(dirtyMonths);dirtyMonths={};
      for(var i=0;i<keys.length;i++){
        var ym=keys[i].slice(2),days={};
        Object.keys(S.days).forEach(function(d){if(d.slice(0,7)===ym&&S.days[d].length)days[d]=S.days[d]});
        await dbCol.doc(keys[i]).set({json:JSON.stringify(days)});
      }
    }
  }catch(e){console.error('Opslaan mislukt',e)}
  saving=false;
}
async function initStore(){
  if(!window.claude||!window.claude.use)return;

  }catch(e){sampleFn=null}
  try{
    var db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    var id=await user.id();if(!id)return;
    dbCol=db.collection('data/users/'+id);
    var snap=await dbCol.get();
    if(snap.empty){
      if(S.weights.length||Object.keys(S.days).length||S.products.length||S.meals.length){dirtyMeta=true;Object.keys(S.days).forEach(function(d){dirtyMonths[monthKey(d)]=true});flush()}
    }else{
      var days={},meta=null;
      snap.docs.forEach(function(d){
        var data=d.data()||{};if(!data.json)return;
        var parsed;try{parsed=JSON.parse(data.json)}catch(e){return}
        if(d.id==='meta')meta=parsed;else if(d.id.indexOf('m-')===0)Object.assign(days,parsed);
      });
      if(meta){S.goals=Object.assign({},S.goals,meta.goals||{});S.weights=meta.weights||[];S.products=meta.products||[];S.meals=meta.meals||[];S.water=meta.water||{};S.profile=meta.profile||{};S.track=meta.track||{}}
      S.days=days;fixState();saveLocal();if(!sh)render();
    }
  }catch(e){console.error('db niet beschikbaar',e);dbCol=null}
}

function ringSVG(tot){
  var goal=Math.max(S.goals.kcal,1),R=86,C=2*Math.PI*R,frac=Math.min(tot.kcal/goal,1);
  var mk={p:tot.p*4,c:tot.c*4,f:tot.f*9},msum=mk.p+mk.c+mk.f,segs='';
  if(msum>0&&frac>0){
    var off=0;
    [['p','var(--p)'],['c','var(--c)'],['f','var(--f)']].forEach(function(m){
      var len=C*frac*(mk[m[0]]/msum);
      if(len>0.5)segs+='<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="'+m[1]+'" stroke-width="17" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';
      off+=len;
    });
  }else if(frac>0){segs='<circle cx="105" cy="105" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="17" stroke-dasharray="'+(C*frac)+' '+C+'"/>'}
  return '<svg viewBox="0 0 210 210" role="img" aria-label="Calorieën gegeten"><circle cx="105" cy="105" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="17"/>'+segs+'</svg>';

  var pool=S.products.map(function(p){return Object.assign({src:'own'},p)}).concat(DB);

var PHOTO_PROMPT='Schat wat er op deze foto van mijn maaltijd ligt. Splits het in losse onderdelen (bijv. rijst, kip, saus, groente). '+
  'Zet verborgen dingen die er waarschijnlijk in zitten, zoals bakolie, boter of room, er als apart onderdeel bij. Weet je iets niet zeker, geef dan je beste schatting.\n'+

  'Antwoord met alleen deze JSON in een codeblok, zonder uitleg:\n'+
  '{"items":[{"name":"Witte rijst, gekookt","g":150,"kcal":130,"p":2.7,"c":28,"f":0.3,"sug":0.1,"fib":0.4,"sat":0.1,"salt":0,"caf":0}]}';

function parsePhoto(text){
  var s=String(text||'').replace(/[“”„‟″]/g,'"').replace(/[‘’]/g,"'");
  var i1=s.indexOf('['),i2=s.indexOf('{');
  var st=i1>-1&&(i2<0||i1<i2)?i1:i2;if(st<0)return null;
  var en=s.charAt(st)==='['?s.lastIndexOf(']'):s.lastIndexOf('}');if(en<=st)return null;

  var arr=Array.isArray(o)?o:o&&Array.isArray(o.items)?o.items:o&&o.name?[o]:[];

/* ---------- Open Food Facts ---------- */
var OFFKEY='voedingstracker-off2',OFFTTL=30*864e5; // cache 30 dagen. "2": sinds de extra stoffen (oude cache mist die)
try{localStorage.removeItem('voedingstracker-off');localStorage.removeItem('voedingstracker-offq')}catch(e){}
function offCache(){try{return JSON.parse(localStorage.getItem(OFFKEY))||{}}catch(e){return {}}}
function offStore(code,item){
  try{var c=offCache();c[code]={t:Date.now(),item:item};
    var keys=Object.keys(c);if(keys.length>300){keys.sort(function(a,b){return c[a].t-c[b].t}).slice(0,keys.length-300).forEach(function(k){delete c[k]})}
    localStorage.setItem(OFFKEY,JSON.stringify(c))}catch(e){}
}
function offToItem(code,pr){
  var n=pr&&pr.nutriments;if(!n)return null;
  var kcal=n['energy-kcal_100g'];
  if(!isFinite(kcal)&&isFinite(n['energy-kj_100g']))kcal=n['energy-kj_100g']/4.184;
  if(!isFinite(kcal))return null; // zonder kcal hebben we niets aan het product
  var name=String(pr.product_name_nl||pr.product_name||'Product').trim();
  var brand=String(pr.brands||'').split(',')[0].trim();
  if(brand&&name.toLowerCase().indexOf(brand.toLowerCase())<0)name+=' ('+brand+')';
  var serving=num(pr.serving_quantity);
  var it={src:'off',isNew:true,barcode:code,name:name.slice(0,80),kcal:Math.round(num(kcal)),
    p:r1(num(n.proteins_100g)),c:r1(num(n.carbohydrates_100g)),f:r1(num(n.fat_100g)),
    portion:serving>0&&serving<2000?Math.round(serving):100,unit:'portie'};
  // Extra stoffen alleen als OFF ze kent (ontbreken = onbekend, niet 0). Cafeïne staat in OFF in gram.
  var opt=function(v){var x=parseFloat(v);return isFinite(x)?x:null};
  var salt=opt(n.salt_100g);if(salt==null&&opt(n.sodium_100g)!=null)salt=opt(n.sodium_100g)*2.5;
  var caf=opt(n.caffeine_100g);
  copyX(it,{sug:opt(n.sugars_100g),fib:opt(n.fiber_100g),sat:opt(n['saturated-fat_100g']),salt:salt,caf:caf==null?null:caf*1000},function(v,k){return rx(k,v)});
  return it;
}
// Open Food Facts geeft bij drukte 503 ZONDER CORS-header. De browser ziet dan een netwerkfout (TypeError)
// in plaats van status 503. Daarom ook bij een netwerkfout opnieuw proberen, behalve als we echt offline zijn.
async function offFetch(url,ms){
  var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort()},ms),r=null,err=null;
  try{
    for(var a=0;a<3;a++){
      if(a)await new Promise(function(ok){setTimeout(ok,1500*a)});
      try{r=await fetch(url,{signal:ctl.signal});err=null;if(r.status!==503&&r.status!==429)break}
      catch(e){if(e.name==="AbortError")throw e;err=e;r=null;if(navigator.onLine===false)break}
    }
    if(err)throw err;
    if(r.status===404)return null;
    if(!r.ok)throw new Error("off "+r.status);
    return await r.json();
  }finally{clearTimeout(timer)}
}
function offErrMsg(e){
  if(navigator.onLine===false)return "Je bent offline. Controleer je internetverbinding.";
  if(e&&e.name==="AbortError")return "Open Food Facts reageert niet. Probeer het straks opnieuw.";
  return "Open Food Facts is even druk. Probeer het over een minuut opnieuw.";
}
async function offLookup(code){
  var hit=offCache()[code];
  if(hit&&Date.now()-hit.t<OFFTTL&&hit.item)return hit.item;
  var j=await offFetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_nl,brands,serving_quantity,nutriments',12000); // null = barcode onbekend (404)
  var item=j&&j.status===1?offToItem(code,j.product):null;
  if(item)offStore(code,item);
  return item;
}
// Zoeken op naam. De zoek-API is traag en heeft een limiet (±10 per minuut), dus alleen op verzoek en met cache.
var OFFQKEY='voedingstracker-offq2',OFFQTTL=7*864e5; // cache 7 dagen
function offQCache(){try{return JSON.parse(localStorage.getItem(OFFQKEY))||{}}catch(e){return {}}}
function offQStore(q,items){
  try{var c=offQCache();c[q]={t:Date.now(),items:items};
    var keys=Object.keys(c);if(keys.length>50){keys.sort(function(a,b){return c[a].t-c[b].t}).slice(0,keys.length-50).forEach(function(k){delete c[k]})}
    localStorage.setItem(OFFQKEY,JSON.stringify(c))}catch(e){}
}
async function offSearchFetch(q){
  var key=norm(q).replace(/\s+/g,' ').trim(),hit=offQCache()[key];
  if(hit&&Date.now()-hit.t<OFFQTTL)return hit.items;
  var url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&json=1&page_size=24&sort_by=unique_scans_n&tagtype_0=countries&tag_contains_0=contains&tag_0=netherlands&fields=code,product_name,product_name_nl,brands,serving_quantity,nutriments';
  var j=(await offFetch(url,15000))||{},seen={},items=[];
  (j.products||[]).forEach(function(pr){
    var it=offToItem(String(pr.code||''),pr);if(!it)return;
    var k=it.name.toLowerCase()+'|'+it.kcal;if(seen[k])return; // dubbele producten overslaan
    seen[k]=1;items.push(it);
  });
  items=items.slice(0,12);
  offQStore(key,items);
  return items;
}
async function offSearch(){
  var q=sh&&sh.q.trim();if(!q||sh.offBusy)return;
  if(sh.offQ===q&&!sh.offErr)return; // al gezocht
  var mine=sh;
  sh.offBusy=true;sh.offErr='';sh.offQ=q;sh.off=[];renderResultsOnly();
  try{mine.off=await offSearchFetch(q)}
  catch(e){mine.offErr=offErrMsg(e)}
  mine.offBusy=false;
  if(sh===mine)renderResultsOnly();
}

function isoWeek(d){var x=fromIso(d);x.setDate(x.getDate()+3-(x.getDay()+6)%7);var w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/864e5-3+(w1.getDay()+6)%7)/7)}
function weekDays(mon){var out=[];for(var i=0;i<7;i++){var d=addDays(mon,i),l=dayEntries(d);out.push({d:d,n:l.length,t:sumOf(l)})}return out}
// Gemiddelde over gelogde dagen. Vandaag telt alleen mee als er verder niets is: de dag is nog niet af.
function weekAvg(days){
  var t=todayIso(),lg=days.filter(function(x){return x.n&&x.d<t});
  if(!lg.length)lg=days.filter(function(x){return x.n&&x.d<=t});
  if(!lg.length)return null;
  var ks=['kcal','p','c','f'].concat(XK),n=lg.length,g=S.goals.kcal,o={n:n,withToday:lg.some(function(x){return x.d===t}),
    onGoal:lg.filter(function(x){return Math.abs(x.t.kcal-g)<=g*0.1}).length};
  ks.forEach(function(k){o[k]=lg.reduce(function(a,x){return a+x.t[k]},0)/n});
  return o;
}

  var Y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};

  if(S.goals.kg>0){var gy=Y(S.goals.kg);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-R)+'" y="'+(gy-5)+'" text-anchor="end" font-size="11" fill="var(--c)">doel '+nf(S.goals.kg,1)+'</text>'}

  if(pts.length>1){
    s+='<path d="'+path+' L'+X(pts[pts.length-1].d).toFixed(1)+' '+(H-B)+' L'+X(pts[0].d).toFixed(1)+' '+(H-B)+' Z" fill="url(#wg)"/>';
    s+='<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';

  });
  var fmt=function(d){return new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short'}).format(fromIso(d))};
  s+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+fmt(pts[0].d)+'</text>';
  if(pts.length>1)s+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmt(pts[pts.length-1].d)+'</text>';
  return s+'</svg>';
}

/* ---------- tips ---------- */
function remaining(){
  var tot=sumOf(dayEntries(todayIso())),g=S.goals;
  return {kcal:g.kcal-tot.kcal,p:g.p-tot.p,c:g.c-tot.c,f:g.f-tot.f,tot:tot};
}
function seeded(seed){var s=seed*9301+49297;return function(){s=(s*9301+49297)%233280;return s/233280}}
function suggestions(){
  var r=remaining();if(r.kcal<70)return [];
  var tv=[Math.max(r.p,0)*4,Math.max(r.c,0)*4,Math.max(r.f,0)*9],tn=Math.hypot(tv[0],tv[1],tv[2]);
  if(tn===0)tv=[1,1,1],tn=Math.sqrt(3);
  var pool=S.products.map(function(p){return Object.assign({src:'own'},p)}).concat(DB);
  var out=[];
  pool.forEach(function(it){
    if(['Koffie (zwart)','Thee (zwart)','Espresso','Energiedrank','Cola zero','Bier','Rode wijn','Cola'].indexOf(it.name)>-1)return;
    var per=it.portion||100,best=null;
    [0.5,1,1.5,2,3].forEach(function(k){var s=scaleItem(it,per*k);if(s.kcal<=r.kcal*0.9&&s.kcal>=Math.min(60,r.kcal*0.3))best={k:k,g:Math.round(per*k),s:s}});
    if(!best)return;
    var v=[best.s.p*4,best.s.c*4,best.s.f*9],vn=Math.hypot(v[0],v[1],v[2])||1,cos=(v[0]*tv[0]+v[1]*tv[1]+v[2]*tv[2])/(vn*tn);
    var over=Math.max(0,best.s.p-Math.max(r.p,0))+Math.max(0,best.s.c-Math.max(r.c,0))+Math.max(0,best.s.f-Math.max(r.f,0));
    var sc=cos-over/(best.s.p+best.s.c+best.s.f+1)*0.8;
    var fi={p:0,c:1,f:2}[tipFocus];
    if(fi!==undefined){sc=(v[fi]/(v[0]+v[1]+v[2]+.001))*0.7+sc*0.3}
    if(it.src==='own')sc+=0.05;
    out.push({it:it,best:best,sc:sc});
  });
  out.sort(function(a,b){return b.sc-a.sc});
  var top=out.slice(0,14),rnd=seeded(tipSeed+1);
  if(tipSeed>0)top.sort(function(){return rnd()-.5});
  return top.slice(0,6);
}
function tipList(r){
  var t=[],g=S.goals,todayN=dayEntries(todayIso()).length;
  if(!todayN)t.push(['📝','Je hebt vandaag nog niets gelogd. Begin met je eerste maaltijd, dan worden de suggesties hieronder persoonlijk.']);
  else if(r.kcal<-g.kcal*0.05)t.push(['💛','Je zit '+nf(-r.kcal)+' kcal boven je doel. Eén dag verandert weinig; kijk naar het weekgemiddelde in plaats van naar één dag.']);
  else if(r.kcal>0){
    if(r.p>25)t.push(['💪','Je mist nog '+nf(r.p)+' g eiwit. Kwark, skyr, kip, tofu of een eiwitshake vullen dat snel aan.']);
    if(r.f<8&&r.kcal>200)t.push(['🥑','Je vetruimte is bijna op. Kies voor de rest van de dag mager en koolhydraatrijk, zoals fruit, rijst of brood.']);
    if(r.c<15&&r.kcal>200)t.push(['🥩','Je koolhydraten zitten bijna vol. Eiwit met groente past nu goed, bijvoorbeeld kip met broccoli.']);
    if(r.c>60&&r.kcal>250)t.push(['🍚','Je hebt nog ruimte voor '+nf(r.c)+' g koolhydraten, handig voor rijst, pasta, havermout of fruit.']);
    if(r.kcal<150)t.push(['🍎','Nog maar '+nf(r.kcal)+' kcal ruimte. Een stuk fruit of een bakje magere kwark past er net in.']);
  }else t.push(['✅','Je zit precies op je doel. Goed bezig.']);
  if(!t.length)t.push(['✅','Je verdeling ziet er goed uit. Houd het vol.']);
  return t.slice(0,4);
}
function renderTips(){
  var r=remaining(),h='<div class="pagehead">'+'<h1>Tips &amp; tools</h1><p>Slimme ideeën op basis van wat je vandaag nog over hebt.</p></div>';
  h+='<div class="card"><h2>Nog over vandaag</h2><div class="left4"><div><b class="num" style="color:'+(r.kcal<0?'var(--over)':'inherit')+'">'+nf(r.kcal)+'</b><span>kcal</span></div><div><b class="num dp">'+nf(r.p)+'</b><span>eiwit g</span></div><div><b class="num dc">'+nf(r.c)+'</b><span>koolh. g</span></div><div><b class="num df">'+nf(r.f)+'</b><span>vet g</span></div></div></div>';
  h+='<div class="card"><h2>Tips voor nu</h2>'+tipList(r).map(function(t){return '<div class="tip"><span class="ti">'+t[0]+'</span><span>'+esc(t[1])+'</span></div>'}).join('')+'</div>';
  var sg=suggestions();
  h+='<div class="card"><h2>Dit past erbij</h2><div class="chips">'+[['all','Alles'],['p','Eiwit'],['c','Koolhydraten'],['f','Vet']].map(function(f){return '<button class="chip" data-focus="'+f[0]+'" aria-pressed="'+(tipFocus===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>';
  if(!sg.length)h+='<div class="empty" style="padding:8px 0">Je hebt vandaag geen ruimte meer over voor suggesties.</div>';
  sg.forEach(function(x,i){
    var unit=x.it.unit||'portie',cnt=x.best.k;
    h+='<div class="sugg"><div><div class="n">'+esc(x.it.name)+'</div><div class="m num">'+nf(x.best.g)+' g'+(x.it.portion?' ('+(cnt===1?'1':nf(cnt,1))+' '+esc(unit)+')':'')+' · <b class="dp">E '+nf(x.best.s.p)+'</b> <b class="dc">K '+nf(x.best.s.c)+'</b> <b class="df">V '+nf(x.best.s.f)+'</b> · '+nf(x.best.s.kcal)+' kcal</div></div><button data-sugg="'+i+'">Toevoegen</button></div>';
  });
  h+='<div style="margin-top:12px"><button class="secondary" data-act="shuffle">Andere suggesties</button></div></div>';
  window._sg=sg;
  if(sampleFn){
    h+='<div class="card"><h2>Ideeën van Claude</h2><p class="hint" style="margin:-4px 0 10px">Krijg maaltijd- of snackideeën die passen bij je resterende macro\'s.</p>'+
      '<div class="field"><label for="pref">Voorkeur (optioneel)</label><input id="pref" type="text" placeholder="bijv. vegetarisch, snel klaar, zonder oven" value=""></div>'+
      '<button class="primary" data-act="ideas"'+(aiBusy?' disabled':'')+'>'+(aiBusy?'Claude denkt na…':'Geef me ideeën')+'</button><div class="ideas" id="ideas">'+esc(aiIdeas)+'</div></div>';
  }
  var pr=S.profile,lw=lastWeight();
  h+='<div class="card"><h2>Doel berekenen <small>richtwaarde</small></h2>'+
    '<div class="grid2"><div class="field"><label for="tSex">Geslacht</label><select id="tSex"><option value="m"'+(pr.sex!=='v'?' selected':'')+'>Man</option><option value="v"'+(pr.sex==='v'?' selected':'')+'>Vrouw</option></select></div>'+
    '<div class="field"><label for="tAge">Leeftijd</label><input id="tAge" type="text" inputmode="numeric" value="'+(pr.age||'')+'"></div></div>'+
    '<div class="grid2"><div class="field"><label for="tH">Lengte (cm)</label><input id="tH" type="text" inputmode="numeric" value="'+(pr.h||'')+'"></div>'+
    '<div class="field"><label for="tW">Gewicht (kg)</label><input id="tW" type="text" inputmode="decimal" value="'+(pr.w||(lw?lw.kg:''))+'"></div></div>'+
    '<div class="field"><label for="tAct">Activiteit</label><select id="tAct">'+[[1.2,'Zittend, weinig beweging'],[1.375,'Licht actief (1–3 trainingen)'],[1.55,'Matig actief (3–5 trainingen)'],[1.725,'Zeer actief (6–7 trainingen)']].map(function(o){return '<option value="'+o[0]+'"'+((pr.act||1.375)==o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
    '<div class="field"><label for="tGoal">Doel</label><select id="tGoal">'+[['cut','Afvallen (−15%)'],['keep','Gewicht behouden'],['bulk','Spiermassa opbouwen (+10%)']].map(function(o){return '<option value="'+o[0]+'"'+((pr.goal||'keep')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
    '<button class="primary" data-act="calc">Bereken</button><div id="calcOut"></div><p class="hint" style="margin:10px 0 0">Gebaseerd op de Mifflin-St Jeor-formule. Dit is een schatting en geen medisch advies.</p></div>';
  $('#view').innerHTML=h;
  if(calc)showCalc();
}
function doCalc(){
  var sex=$('#tSex').value,age=num($('#tAge').value),hh=num($('#tH').value),w=num($('#tW').value),act=num($('#tAct').value),goal=$('#tGoal').value;
  if(!(age>0&&hh>0&&w>0)){toast('Vul leeftijd, lengte en gewicht in');return}
  S.profile={sex:sex,age:age,h:hh,w:w,act:act,goal:goal};markDirty(null);
  var bmr=10*w+6.25*hh-5*age+(sex==='m'?5:-161),tdee=bmr*act,kcal=Math.round(tdee*(goal==='cut'?0.85:goal==='bulk'?1.10:1)/10)*10;
  var p=Math.round(w*(goal==='cut'?2.0:goal==='bulk'?1.9:1.7)),f=Math.round(kcal*0.27/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  calc={tdee:Math.round(tdee),kcal:kcal,p:p,c:c,f:f};showCalc();
}
function showCalc(){
  var el=$('#calcOut');if(!el||!calc)return;
  el.innerHTML='<div class="notice" style="margin-top:12px">Je onderhoud ligt rond <b class="num">'+nf(calc.tdee)+' kcal</b>. Voorstel: <b class="num">'+nf(calc.kcal)+' kcal</b> met <b class="dp num">'+calc.p+' g eiwit</b>, <b class="dc num">'+calc.c+' g koolhydraten</b> en <b class="df num">'+calc.f+' g vet</b>.</div><button class="secondary" data-act="usecalc">Gebruik als mijn doel</button>';
}
async function askIdeas(){
  if(!sampleFn||aiBusy)return;
  var r=remaining(),pref=($('#pref')&&$('#pref').value||'').trim().slice(0,120);
  aiBusy=true;aiIdeas='';
  var btn=document.querySelector('[data-act="ideas"]');if(btn){btn.disabled=true;btn.textContent='Claude denkt na…'}
  var out=$('#ideas');
  var prompt='Ik houd mijn voeding bij. Vandaag heb ik nog over: '+Math.round(r.kcal)+' kcal, '+Math.round(r.p)+' g eiwit, '+Math.round(r.c)+' g koolhydraten en '+Math.round(r.f)+' g vet.'+(pref?' Voorkeur: '+pref+'.':'')+
    '\nGeef 3 korte ideeën voor een maaltijd of snack die hier goed bij past, met gangbare Nederlandse producten en ongeveer de hoeveelheden en de geschatte kcal/eiwit/koolhydraten/vet. Schrijf in het Nederlands, kort en praktisch, geen inleiding en geen opmaaktekens zoals sterretjes of kopjes. Als er (bijna) geen ruimte meer is, zeg dat dan vriendelijk en noem één kleine optie.';
  try{
    var res=await sampleFn(prompt,{modelTier:'quick',cache:false,onText:function(o){aiIdeas=o.text;var el=$('#ideas');if(el)el.textContent=o.text}});
    aiIdeas=res.text;
  }catch(e){aiIdeas=(e&&e.text)||'Ideeën ophalen lukt nu niet. Probeer het later opnieuw.'}
  aiBusy=false;if(tab==='tips')renderTips();
}

/* ---------- doelen ---------- */
var PRESETS=[['Gebalanceerd',30,40,30],['Veel eiwit',35,40,25],['Low carb',30,25,45],['Sport',25,55,20]];
function renderGoals(){
  var g=S.goals;
  var h='<div class="pagehead">'+'<h1>Doelen</h1><p>Pas je dagelijkse calorieën en macro\'s aan.</p></div>'+
    '<div class="card"><h2>Dagdoel</h2><div class="field"><label for="gK">Calorieën (kcal)</label><input id="gK" type="text" inputmode="decimal" value="'+g.kcal+'"></div>'+
    '<div class="field" style="margin-bottom:6px"><label>Snelle verdeling van je macro\'s</label></div><div class="chips">'+PRESETS.map(function(p,i){return '<button class="chip" data-preset="'+i+'" aria-pressed="false">'+p[0]+' '+p[1]+'/'+p[2]+'/'+p[3]+'</button>'}).join('')+'</div>'+
    '<div class="hint" style="margin-top:0">Volgorde: eiwit / koolhydraten / vet, in % van je calorieën.</div>'+
    '<div class="grid3"><div class="field"><label for="gP">Eiwit (g)</label><input id="gP" type="text" inputmode="decimal" value="'+g.p+'"></div>'+
    '<div class="field"><label for="gC">Koolh. (g)</label><input id="gC" type="text" inputmode="decimal" value="'+g.c+'"></div>'+
    '<div class="field"><label for="gF">Vet (g)</label><input id="gF" type="text" inputmode="decimal" value="'+g.f+'"></div></div>'+
    '<div class="hint" id="gHint"></div><div id="gFix"></div>'+
    '<button class="primary" data-act="gsave">Doel opslaan</button></div>'+
    '<div class="card"><h2>Streefgewicht</h2><div class="field"><label for="gKg">Gewicht (kg), leeg = geen doel</label><input id="gKg" type="text" inputmode="decimal" value="'+(g.kg>0?g.kg:'')+'"></div>'+
    '<button class="primary" data-act="gkgsave">Opslaan</button></div>'+
    mealsCard()+productsCard()+
    '<div class="card"><h2>Weet je je doel niet?</h2><p class="hint" style="margin:0 0 10px">Bereken een richtwaarde op basis van je lengte, gewicht en activiteit.</p><button class="secondary" data-tab-go="tips">Naar de doelberekening</button></div>';
  $('#view').innerHTML=h;
  updGoalHint();
}

/* ---------- instellingen ---------- */
function renderSettings(){
  var h='<div class="pagehead"><h1>Instellingen</h1><p>Weergave en wat je bijhoudt.</p></div>'+
    '<div class="card"><h2>Weergave</h2><div class="seg" role="group" aria-label="Weergave" style="margin-bottom:8px">'+[['light','Licht'],['dark','Donker'],['auto','Automatisch']].map(function(o){return '<button data-theme-set="'+o[0]+'" aria-pressed="'+(UI.theme===o[0])+'">'+o[1]+'</button>'}).join('')+'</div><p class="hint" style="margin:0">Automatisch volgt de instelling van je telefoon.</p></div>'+
    '<div class="card"><h2>Bijhouden</h2><p class="hint" style="margin:-4px 0 6px">Calorieën, eiwit, koolhydraten en vet houd je altijd bij. Vink aan wat je daarnaast wilt zien op Vandaag en Week.</p>'+
    EXTRA.map(function(x){var on=!!S.track[x[0]];
      return '<div class="trow"><label class="check"><input type="checkbox" data-track="'+x[0]+'"'+(on?' checked':'')+'> '+x[1]+'</label>'+
        (on?'<span class="tgoal">'+x[2]+' <input data-tgoal="'+x[0]+'" type="text" inputmode="decimal" value="'+S.goals[x[0]]+'" aria-label="Doel '+x[1].toLowerCase()+' in '+x[4]+'"> '+x[4]+'</span>':'')+'</div>';
    }).join('')+
    '<p class="hint" style="margin:10px 0 0">De doelen zijn richtwaarden voor volwassenen. Producten uit Open Food Facts en de ingebouwde lijst hebben deze gegevens meestal; bij eigen producten en handmatige invoer vul je ze zelf in. Eten dat je al eerder hebt ingevoerd, heeft ze niet.</p></div>'+
    '<div class="card"><h2>Opslag</h2><p class="hint" style="margin:0">'+(dbCol?'Je gegevens worden privé in je account bewaard en zijn op elk apparaat beschikbaar.':'Je gegevens worden in deze browser bewaard. Open de pagina op hetzelfde apparaat om ze terug te zien.')+'</p></div>';
  $('#view').innerHTML=h;
}
function mealsCard(){
  var h='<div class="card"><h2>Mijn maaltijden'+(S.meals.length?'<small class="num">'+S.meals.length+'</small>':'')+'</h2>';
  if(!S.meals.length)return h+'<p class="hint" style="margin:0">Nog geen vaste maaltijden. Tik op Vandaag onder een maaltijd op "Bewaar als vaste maaltijd", dan kun je hem later met één tik toevoegen.</p></div>';
  return h+S.meals.map(function(x){return '<button class="res" data-mealid="'+esc(x.id)+'"><div><div class="n">'+esc(x.name)+'</div><div class="m num">'+x.items.length+(x.items.length===1?' onderdeel':' onderdelen')+' · '+nf(sumOf(x.items).kcal)+' kcal</div></div><div class="r">Bewerk</div></button>'}).join('')+'</div>';
}
function productsCard(){
  var ps=S.products.slice().sort(function(a,b){return a.name.localeCompare(b.name,'nl')});
  var h='<div class="card"><h2>Mijn producten'+(ps.length?'<small class="num">'+ps.length+'</small>':'')+'</h2>';
  if(!ps.length)return h+'<p class="hint" style="margin:0">Nog geen eigen producten. Vink bij het toevoegen "Bewaar in Mijn producten" aan, dan verschijnen ze hier.</p></div>';
  return h+ps.map(function(p){return '<button class="res" data-prod="'+esc(p.id)+'"><div><div class="n">'+esc(p.name)+'</div><div class="m num">'+itemPer100(p)+'</div></div><div class="r">Bewerk</div></button>'}).join('')+'</div>';
}
function updGoalHint(){
  if(!$('#gHint'))return;
  var k=num($('#gK').value),mk=num($('#gP').value)*4+num($('#gC').value)*4+num($('#gF').value)*9,off=k>0&&Math.abs(mk-k)/k>0.05;
  $('#gHint').className='hint'+(off?' warn':'');
  $('#gHint').textContent='Je macro\'s komen samen op '+nf(mk)+' kcal'+(off?', dat wijkt af van je calorieëndoel.':'.');
  $('#gFix').innerHTML=off?'<button class="secondary" data-act="gfix" style="margin-bottom:12px">Zet calorieën op '+nf(mk)+'</button>':'';
}

/* ---------- events (pagina) ---------- */
document.addEventListener('click',function(e){
  if(sh)return;
  var t=e.target.closest('[data-tab],[data-tab-go],[data-act],[data-add],[data-edit],[data-range],[data-wdel],[data-focus],[data-sugg],[data-preset],[data-prod],[data-savemeal],[data-mealid],[data-wday],[data-goday],[data-copy],[data-toggle],[data-theme-set]');
  var svg=e.target.closest('#wsvg');
  if(svg){weightPick(e,svg);return}
  if(!t)return;
  var d=t.dataset;
  if(d.tab||d.tabGo){tab=d.tab||d.tabGo;render();window.scrollTo(0,0);return}
  if(d.add){openSheet(d.add,null);return}
  if(d.edit){var en=dayEntries(date).find(function(x){return x.id===d.edit});if(en)openSheet(en.meal,en);return}
  if(d.prod){var pd=S.products.find(function(x){return x.id===d.prod});if(pd)openSheet(null,null,pd);return}
  if(d.themeSet){UI.theme=d.themeSet;saveUI();applyTheme();render();return}
  if(d.copy){copyFromPrev(d.copy);return}
  if(d.toggle){mealOpen[d.toggle]=!mealOpen[d.toggle];saveUI();var ty=window.scrollY;render();window.scrollTo(0,ty);return}
  if(d.savemeal){var ml=MEALS.filter(function(m){return m[0]===d.savemeal})[0];
    openSheet(null,null,null,{id:null,name:'Mijn '+ml[1].toLowerCase(),items:dayEntries(date).filter(function(x){return x.meal===d.savemeal}).map(mealItem)});return}
  if(d.mealid){var sm=S.meals.find(function(x){return x.id===d.mealid});if(sm)openSheet(null,null,null,JSON.parse(JSON.stringify(sm)));return}
  if(d.wday){selDay=selDay===d.wday?null:d.wday;var sy=window.scrollY;render();window.scrollTo(0,sy);return}
  if(d.goday){date=d.goday;tab='today';render();window.scrollTo(0,0);return}
  if(d.range!=null){range=+d.range;selW=null;render();return}
  if(d.wdel){S.weights=S.weights.filter(function(p){return p.d!==d.wdel});selW=null;markDirty(null);render();return}
  if(d.focus){tipFocus=d.focus;tipSeed=0;render();return}
  if(d.sugg!=null){var x=window._sg[+d.sugg];if(x){var meal=mealNow();addEntry(todayIso(),entryFrom(x.it,x.best.g,meal));toast('Toegevoegd aan '+MEALS.filter(function(m){return m[0]===meal})[0][1].toLowerCase());render()}return}
  if(d.preset!=null){var pr=PRESETS[+d.preset],k=num($('#gK').value)||S.goals.kcal;
    $('#gP').value=Math.round(k*pr[1]/100/4);$('#gC').value=Math.round(k*pr[2]/100/4);$('#gF').value=Math.round(k*pr[3]/100/9);
    document.querySelectorAll('[data-preset]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});updGoalHint();return}
  var a=d.act;
  if(a==='prev'){date=addDays(date,-1);render()}
  else if(a==='next'){date=addDays(date,1);render()}
  else if(a==='wprev'){week=addDays(week,-7);selDay=null;render()}
  else if(a==='wnext'){week=addDays(week,7);selDay=null;render()}
  else if(a==='wsave'){
    var kg=num($('#wKg').value),dd=$('#wDate').value||todayIso();
    if(!(kg>20&&kg<400)){$('#wKg').focus();return}
    S.weights=S.weights.filter(function(p){return p.d!==dd});S.weights.push({d:dd,kg:r1(kg)});markDirty(null);toast('Gewicht opgeslagen');render();
  }
  else if(a==='shuffle'){tipSeed++;render()}
  else if(a==='ideas')askIdeas();
  else if(a==='calc')doCalc();
  else if(a==='usecalc'&&calc){S.goals.kcal=calc.kcal;S.goals.p=calc.p;S.goals.c=calc.c;S.goals.f=calc.f;markDirty(null);toast('Doel bijgewerkt');tab='today';render();window.scrollTo(0,0)}
  else if(a==='gfix'){$('#gK').value=Math.round(num($('#gP').value)*4+num($('#gC').value)*4+num($('#gF').value)*9);updGoalHint()}
  else if(a==='gsave'){
    var kc=num($('#gK').value);if(kc<=0){$('#gK').focus();return}
    S.goals.kcal=Math.round(kc);S.goals.p=Math.round(num($('#gP').value));S.goals.c=Math.round(num($('#gC').value));S.goals.f=Math.round(num($('#gF').value));
    markDirty(null);toast('Doel opgeslagen');
  }
  else if(a==='gkgsave'){var w=num($('#gKg').value);S.goals.kg=(w>20&&w<400)?r1(w):0;markDirty(null);toast('Streefgewicht opgeslagen')}
});
function weightPick(ev,svg){
  var all=S.weights.slice().sort(function(a,b){return a.d<b.d?-1:1}),cutoff=range>0?addDays(todayIso(),-range):'0000-00-00',pts=all.filter(function(p){return p.d>=cutoff});
  if(!pts.length)return;
  var rect=svg.getBoundingClientRect(),x=(ev.clientX-rect.left)/rect.width*340,L=38,R=14,t0=fromIso(pts[0].d).getTime(),t1=fromIso(pts[pts.length-1].d).getTime(),best=null,bd=1e9;
  pts.forEach(function(p){var px=t1===t0?(L+(340-L-R)/2):L+(fromIso(p.d).getTime()-t0)/(t1-t0)*(340-L-R),dd=Math.abs(px-x);if(dd<bd){bd=dd;best=p}});
  if(best){selW=best.d;var y=window.scrollY;render();window.scrollTo(0,y)}
}
document.addEventListener('input',function(e){
  if(sh)return;
  if(['gK','gP','gC','gF'].indexOf(e.target.id)>-1)updGoalHint();
});
document.addEventListener('change',function(e){
  if(sh)return;
  if(e.target.id==='datepick'&&e.target.value){date=e.target.value;render()}
  var d=e.target.dataset;
  if(d.track){S.track[d.track]=e.target.checked;markDirty(null);var y=window.scrollY;render();window.scrollTo(0,y)}
  if(d.tgoal){var v=num(e.target.value);if(v>0){S.goals[d.tgoal]=d.tgoal==='caf'?Math.round(v):r1(v);markDirty(null);toast('Doel opgeslagen')}else e.target.value=S.goals[d.tgoal]}
});

function render(){renderTabs();if(tab==='today')renderToday();else if(tab==='week')renderWeek();else if(tab==='weight')renderWeight();else if(tab==='tips')renderTips();else if(tab==='settings')renderSettings();else renderGoals()}
applyTheme();loadLocal();render();initStore();
})();
</script>
</body>
</html>
